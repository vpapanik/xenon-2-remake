html/head_include="<!-- the page's preview where its link is shared (GitHub Pages) -->
<meta property='og:title' content='Xenon 2: Megablast remake'>
<meta property='og:description' content='A tribute to the legendary Bitmap Brothers : Xenon 2: Megablast (1989), playable in the browser, with Amiga or PC graphics and sound and an ENHANCED edition.'>
<meta property='og:image' content='https://vpapanik.github.io/xenon-2-remake/social.jpg'>
<meta property='og:image:width' content='1280'>
<meta property='og:image:height' content='640'>
<meta property='og:url' content='https://vpapanik.github.io/xenon-2-remake/'>
<meta property='og:type' content='website'>
<meta name='twitter:card' content='summary_large_image'>
<meta name='twitter:image' content='https://vpapanik.github.io/xenon-2-remake/social.jpg'>
<meta name='description' content='Xenon 2: Megablast remake, a tribute to the legendary Bitmap Brothers.'>
<style>
#x2touch{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#x2touch .b{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
#x2left{position:absolute;left:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none}
#x2base{position:absolute;left:17vmin;top:calc(100% - 17vmin);width:22vmin;height:22vmin;margin:-11vmin;border-radius:50%;box-sizing:border-box;background:rgba(170,160,220,0.13);border:2px solid rgba(220,215,255,0.35);pointer-events:none}
#x2base.on{background:rgba(170,160,220,0.22);border-color:rgba(220,215,255,0.55)}
#x2knob{position:absolute;left:50%;top:50%;width:9vmin;height:9vmin;margin:-4.5vmin;border-radius:50%;background:rgba(235,230,255,0.4)}
#x2touch #x2fire{right:6vmin;bottom:7vmin;width:17vmin;height:17vmin;background:rgba(235,70,70,0.3);border:2px solid rgba(255,150,150,0.5)}
#x2touch #x2fire.on{background:rgba(255,90,90,0.6)}
#x2touch #x2dive{right:26vmin;bottom:4vmin;width:11vmin;height:11vmin;background:rgba(70,210,110,0.3);border:2px solid rgba(150,255,170,0.5);display:none}
#x2touch #x2dive.ready{display:flex}
#x2touch #x2dive.on{background:rgba(90,235,130,0.6)}
#x2touch #x2pause{right:3vmin;top:3vmin;width:8vmin;height:8vmin;background:rgba(170,160,220,0.13);border:2px solid rgba(220,215,255,0.35)}
#x2touch #x2pause i{display:block;width:1vmin;height:3vmin;margin:0 0.5vmin;background:rgba(255,255,255,0.7)}
#x2pad{position:absolute;left:6vmin;bottom:6vmin;width:24vmin;height:24vmin;display:none}
#x2touch #x2pad .b{width:8vmin;height:8vmin;border-radius:1.5vmin;background:rgba(170,160,220,0.16);border:2px solid rgba(220,215,255,0.4)}
#x2touch #x2pad .b.on{background:rgba(200,190,255,0.5)}
#x2pad .b i{width:0;height:0;border:1.6vmin solid transparent}
#x2touch #x2u{left:8vmin;top:0}
#x2touch #x2d{left:8vmin;bottom:0}
#x2touch #x2l{left:0;top:8vmin}
#x2touch #x2r{right:0;top:8vmin}
#x2u i{border-bottom:2.2vmin solid rgba(255,255,255,0.7) !important;margin-top:-1.4vmin}
#x2d i{border-top:2.2vmin solid rgba(255,255,255,0.7) !important;margin-bottom:-1.4vmin}
#x2l i{border-right:2.2vmin solid rgba(255,255,255,0.7) !important;margin-left:-1.4vmin}
#x2r i{border-left:2.2vmin solid rgba(255,255,255,0.7) !important;margin-right:-1.4vmin}
#x2touch.menu #x2left,#x2touch.menu #x2base,#x2touch.menu #x2pause{display:none}
#x2touch.menu #x2pad{display:block}
</style>
<script>
(function () {
	// remake : touch controls in the browser, shown on touch screens only, without text.
	// In a level : a joystick (the left half, always shown at the lower left, moved where
	// the thumb lands), the soft red button fires (held, the game's own autofire), the soft
	// green one dives while a dive is left, the two bars pause. On the menus and in the
	// shop : four arrows (a tap a step, held they repeat) and the red button chooses.
	// The game tells which through window.x2state(level, dives). The buttons send the
	// keyboard's keys (arrows, Space, Enter, P) through the canvas.
	var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
	if (!touch || !window.matchMedia('(pointer: coarse)').matches) return;
	var KEYS = {ArrowUp: ['ArrowUp', 38], ArrowDown: ['ArrowDown', 40], ArrowLeft: ['ArrowLeft', 37], ArrowRight: ['ArrowRight', 39], Space: [' ', 32], Enter: ['Enter', 13], KeyP: ['p', 80]};
	var down = {};
	function send(code, on) {
		if (!!down[code] === on) return;
		down[code] = on;
		var canvas = document.getElementById('canvas');
		if (!canvas) return;
		var k = KEYS[code];
		canvas.dispatchEvent(new KeyboardEvent(on ? 'keydown' : 'keyup', {code: code, key: k[0], keyCode: k[1], which: k[1], bubbles: true, cancelable: true}));
	}
	function button(el, code, repeat) {
		var id = null, timer = null;
		function stop() {
			if (timer) clearTimeout(timer);
			timer = null;
		}
		function pulse() {
			// held on the menus : released for a moment and pressed again, a step each time
			send(code, false);
			timer = setTimeout(function () {
				send(code, true);
				timer = setTimeout(pulse, 90);
			}, 110);
		}
		el.addEventListener('touchstart', function (e) {
			e.preventDefault();
			if (id !== null) return;
			id = e.changedTouches[0].identifier;
			el.classList.add('on');
			send(code, true);
			if (repeat) timer = setTimeout(pulse, 400);
		}, {passive: false});
		function release(e) {
			e.preventDefault();
			for (var i = 0; i < e.changedTouches.length; i++) {
				if (e.changedTouches[i].identifier === id) {
					id = null;
					stop();
					el.classList.remove('on');
					send(code, false);
				}
			}
		}
		el.addEventListener('touchend', release, {passive: false});
		el.addEventListener('touchcancel', release, {passive: false});
	}
	function stick(zone, base, knob) {
		var id = null, cx = 0, cy = 0;
		function set(dx, dy) {
			var r = base.clientWidth / 2, d = Math.sqrt(dx * dx + dy * dy), on = d > r * 0.25;
			var a = Math.atan2(dy, dx) * 180 / Math.PI;
			send('ArrowRight', on && a > -67.5 && a < 67.5);
			send('ArrowDown', on && a > 22.5 && a < 157.5);
			send('ArrowLeft', on && (a > 112.5 || a < -112.5));
			send('ArrowUp', on && a > -157.5 && a < -22.5);
			var m = Math.min(d, r * 0.75) / (d || 1);
			knob.style.transform = 'translate(' + dx * m + 'px,' + dy * m + 'px)';
		}
		zone.addEventListener('touchstart', function (e) {
			e.preventDefault();
			if (id !== null) return;
			var t = e.changedTouches[0];
			id = t.identifier;
			cx = t.clientX;
			cy = t.clientY;
			base.style.left = cx + 'px';
			base.style.top = cy + 'px';
			base.classList.add('on');
			set(0, 0);
		}, {passive: false});
		zone.addEventListener('touchmove', function (e) {
			e.preventDefault();
			for (var i = 0; i < e.changedTouches.length; i++) {
				var t = e.changedTouches[i];
				if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
			}
		}, {passive: false});
		function end(e) {
			e.preventDefault();
			for (var i = 0; i < e.changedTouches.length; i++) {
				if (e.changedTouches[i].identifier === id) {
					id = null;
					set(0, 0);
					base.style.left = '';
					base.style.top = '';
					base.classList.remove('on');
				}
			}
		}
		zone.addEventListener('touchend', end, {passive: false});
		zone.addEventListener('touchcancel', end, {passive: false});
		return function () {
			if (id !== null) {
				id = null;
				set(0, 0);
				base.style.left = '';
				base.style.top = '';
				base.classList.remove('on');
			}
		};
	}
	var reset = null;
	window.x2state = function (level, dives) {
		var box = document.getElementById('x2touch');
		if (!box) return;
		var menu = !level;
		if (menu !== box.classList.contains('menu')) {
			if (reset) reset();
			['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].forEach(function (c) { send(c, false); });
		}
		box.classList.toggle('menu', menu);
		document.getElementById('x2dive').classList.toggle('ready', !!level && dives > 0);
	};
	window.addEventListener('DOMContentLoaded', function () {
		var box = document.createElement('div');
		box.id = 'x2touch';
		box.className = 'menu';
		box.innerHTML = '<div id=x2left></div><div id=x2base><div id=x2knob></div></div>' +
			'<div id=x2pad><div class=b id=x2u><i></i></div><div class=b id=x2d><i></i></div><div class=b id=x2l><i></i></div><div class=b id=x2r><i></i></div></div>' +
			'<div class=b id=x2dive></div><div class=b id=x2fire></div><div class=b id=x2pause><i></i><i></i></div>';
		document.body.appendChild(box);
		reset = stick(document.getElementById('x2left'), document.getElementById('x2base'), document.getElementById('x2knob'));
		button(document.getElementById('x2u'), 'ArrowUp', true);
		button(document.getElementById('x2d'), 'ArrowDown', true);
		button(document.getElementById('x2l'), 'ArrowLeft', true);
		button(document.getElementById('x2r'), 'ArrowRight', true);
		button(document.getElementById('x2fire'), 'Space', false);
		button(document.getElementById('x2dive'), 'Enter', false);
		button(document.getElementById('x2pause'), 'KeyP', false);
		box.style.display = 'block';
	});
})();
</script>"
progressive_web_app/enabled=false

